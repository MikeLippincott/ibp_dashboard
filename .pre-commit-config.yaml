repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src pytest
        language: system
        pass_filenames: false
        types: [python]
