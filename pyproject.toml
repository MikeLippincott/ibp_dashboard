[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "profiling-stimations-dashboard"
version = "0.1.0"
description = "Profiling stimations dashboard"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "pycytominer>=1.5.0",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "tqdm>=4.67.3",
    "watchdog>=6.0.0",
]

# install package files
[tool.setuptools.packages.find]
where = ["src"]
